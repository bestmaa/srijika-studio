[workspace]
resolver = "2"
members = [
  "apps/studio/src-tauri",
  "crates/studio-core",
  "crates/studio-bridge",
  "crates/project-store",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97.1"

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.7", features = ["http1", "json", "tokio"] }
getrandom = "0.3.4"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
subtle = "2.6.1"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5.2", features = ["util"] }
