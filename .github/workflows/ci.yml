name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux quality, browser, and generated projects
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Reject production dependency advisories
        run: pnpm audit --prod

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify source quality
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm verify:fast

      - name: Verify package contracts
        run: pnpm test:packages

      - name: Verify Rust cores
        run: pnpm check:rust

      - name: Verify Studio browser behavior
        run: pnpm test:e2e:web

      - name: Verify generated Vite and Next.js owner projects
        env:
          SRIJIKA_RUN_OWNER_VERIFICATION_SMOKE: '1'
        run: pnpm --filter @srijika/developer-engine exec vitest run --config vitest.config.ts test/owner-verification-smoke.test.ts

      - name: Verify Payload and Next.js reference in Chromium
        run: pnpm --filter @srijika/payload-next-reference test:browser

      - name: Build workspace and release artifacts
        run: pnpm build && pnpm --filter @srijika/studio verify:bundle && pnpm release:build && pnpm release:verify

  windows:
    name: Windows CLI, MCP, VS Code, and path contracts
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Verify formatting, types, and platform-neutral units
        run: pnpm format:check && pnpm typecheck && pnpm test

      - name: Verify project, CLI, and VS Code contracts
        run: pnpm --filter @srijika/project-scaffold test && pnpm --filter @srijika/cli test && pnpm --filter srijika-language-support test && pnpm --filter srijika-language-support build

      - name: Verify Windows MCP transport
        run: pnpm release:build && pnpm test:mcp:windows

  macos-runtime:
    name: macOS managed preview contracts
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.13.0'
          package-manager-cache: false

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Verify framework and scaffold contracts
        run: pnpm --filter @srijika/developer-engine test && pnpm --filter @srijika/project-scaffold test

      - name: Verify native runtime contracts
        run: cargo test --locked -p studio-core
