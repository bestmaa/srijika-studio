name: Release npm packages

on:
  pull_request:
    paths:
      - '.github/workflows/release-npm.yml'
      - 'packages/cli/**'
      - 'packages/create-srijika/**'
      - 'packages/architecture-rules/**'
      - 'packages/developer-engine/**'
      - 'packages/mcp-server/**'
      - 'packages/project-scaffold/**'
      - 'scripts/*npm*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after verification (leave off for a safe dry run)
        required: true
        default: false
        type: boolean
      tag:
        description: Version tag to verify, for example v0.1.0
        required: false
        type: string

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release artifacts (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - '22.13.0'
          - '24'
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || '' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Reject production dependency advisories
        run: pnpm audit --prod

      - name: Install Chromium for migration verification
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run regression suite
        run: pnpm test

      - name: Run React migration engine and CLI contracts
        run: pnpm --filter @srijika/developer-engine test && pnpm --filter @srijika/cli test

      - name: Run generated-project install and build smoke
        if: matrix.node == '24'
        env:
          SRIJIKA_RUN_GENERATED_PROJECT_SMOKE: '1'
        run: pnpm --filter @srijika/project-scaffold test

      - name: Run generated Vite and Next.js owner verification
        if: matrix.node == '24'
        env:
          SRIJIKA_RUN_OWNER_VERIFICATION_SMOKE: '1'
        run: pnpm --filter @srijika/developer-engine exec vitest run --config vitest.config.ts test/owner-verification-smoke.test.ts

      - name: Build public packages
        run: pnpm release:build

      - name: Test create-srijika launcher
        run: pnpm --filter create-srijika test

      - name: Test MCP package transports
        run: pnpm test:mcp:stdio && pnpm test:mcp:isolated && pnpm test:mcp:code

      - name: Verify package metadata and tarball contents
        run: pnpm release:verify

  publish:
    name: Publish to npm
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js for npm Trusted Publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install npm with OIDC trusted publishing support
        run: |
          npm install --global npm@12.0.2
          test "$(npm --version)" = '12.0.2'

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Reject production dependency advisories
        run: pnpm audit --prod

      - name: Install Chromium for migration verification
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and re-verify release artifacts
        run: pnpm --filter @srijika/developer-engine test && pnpm --filter @srijika/cli test && pnpm release:build && pnpm test:mcp:isolated && pnpm release:verify

      - name: Publish CLI, MCP server, and create launcher
        env:
          NPM_CONFIG_LOGLEVEL: verbose
          NPM_CONFIG_PROVENANCE: 'true'
        run: pnpm release:publish
